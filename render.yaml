# ─── Render.com Blueprint for AgriAI 2.0 ─────────────────────────────────────
# Deploy: https://dashboard.render.com/blueprints → "New Blueprint Instance"
# The blueprint provisions the web service AND a managed PostgreSQL database.
# After creation, fill in every `sync: false` secret in the dashboard.

databases:
  - name: agriai-db
    plan: free
    databaseName: agriai
    user: agriai

services:
  - type: web
    name: agriai
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://agriai.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: agriai-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDFLARE_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
