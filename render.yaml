# ─── Render.com Blueprint for AgriAI 2.0 ─────────────────────────────────────
# Deploy: https://dashboard.render.com/blueprints → "New Blueprint Instance"
# After creation, fill in every `sync: false` secret in the dashboard.

services:
  - type: web
    name: agriai
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://agriai.onrender.com
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
